<svg xmlns="http://www.w3.org/2000/svg" width="380" height="280" viewBox="0 0 380 280" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="380" height="280" fill="#ffffff"/>
  <defs>
    <marker id="nuoli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Akselit -->
  <line x1="30" y1="230" x2="335" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#nuoli)"/>
  <line x1="60" y1="260" x2="60" y2="25" stroke="#333333" stroke-width="1.5" marker-end="url(#nuoli)"/>
  <text x="330" y="252" fill="#333333">Re</text>
  <text x="70" y="32" fill="#333333">Im</text>
  <text x="44" y="250" fill="#333333">0</text>

  <!-- Kateetit -->
  <line x1="60" y1="230" x2="260" y2="230" stroke="#2a7ab0" stroke-width="3"/>
  <line x1="260" y1="230" x2="260" y2="80" stroke="#2a7ab0" stroke-width="3" stroke-dasharray="7,5"/>
  <path d="M246,230 L246,216 L260,216" fill="none" stroke="#2a7ab0" stroke-width="1.5"/>
  <text x="155" y="252" fill="#2a7ab0" font-weight="bold">4</text>
  <text x="270" y="162" fill="#2a7ab0" font-weight="bold">3</text>

  <!-- Hypotenuusa eli itseisarvo -->
  <line x1="60" y1="230" x2="260" y2="80" stroke="#c0392b" stroke-width="3.5"/>
  <text x="0" y="0" fill="#c0392b" font-weight="bold" transform="translate(128,148) rotate(-36.87)">|z| = 5</text>

  <!-- Piste z -->
  <circle cx="260" cy="80" r="5.5" fill="#c0392b"/>
  <text x="270" y="72" fill="#333333"><tspan font-style="italic">z</tspan> = 4 + 3<tspan font-style="italic">i</tspan></text>
</svg>
